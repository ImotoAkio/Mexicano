version: '3.8'

services:
  app-mexicano:
    # Substitua 'seu_usuario' e 'nome_do_repo' pelo nome real do seu github e repositório
    image: ghcr.io/imotoakio/mexicano:latest 
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-84.247.143.102}
      - DB_PORT=${DB_PORT:-13306}
      - DB_USER=${DB_USER:-nautico_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-gestao_nautica}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://api.echo.dev.br}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-mexicano}
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL}
      # Cloudflare R2 Object Storage
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-checklists}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
    networks:
      - echonet
    volumes:
      # Caso precise persistir os uploads (arquivos físicos enviados) no host
      - mexicano_uploads:/app/uploads
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        # Habilita o Traefik para buscar esse container
        - "traefik.enable=true"
        
        # Rota HTTP -> HTTPS via Traefik
        - "traefik.http.routers.mexicano.rule=Host(`mexicano.echo.dev.br`)"
        - "traefik.http.routers.mexicano.entrypoints=websecure" # Use o nome do seu entrypoint HTTPS (geralmente websecure)
        
        # Porta exposta da aplicação para o Traefik encaminhar o tráfego
        - "traefik.http.services.mexicano.loadbalancer.server.port=3000"
        
        # Certificado SSL Let's Encrypt
        - "traefik.http.routers.mexicano.tls=true"
        - "traefik.http.routers.mexicano.tls.certresolver=myresolver"

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    image: ghcr.io/imotoakio/mexicano-mcp:latest
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-84.247.143.102}
      - DB_PORT=${DB_PORT:-13306}
      - DB_USER=${DB_MCP_USER:-mcp_readonly}
      - DB_PASSWORD=${DB_MCP_PASSWORD:-${DB_PASSWORD}}
      - DB_NAME=${DB_NAME:-gestao_nautica}
      - MCP_PORT=3001
      - MCP_API_KEY=${MCP_API_KEY}
    networks:
      - echonet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mcp.rule=Host(`mcp-mexicano.echo.dev.br`)"
        - "traefik.http.routers.mcp.entrypoints=websecure"
        - "traefik.http.services.mcp.loadbalancer.server.port=3001"
        - "traefik.http.routers.mcp.tls=true"
        - "traefik.http.routers.mcp.tls.certresolver=myresolver"

networks:
  echonet:
    external: true

volumes:
  mexicano_uploads:
    # Volume criado no docker local para não perder imagens salvas se o container reiniciar
