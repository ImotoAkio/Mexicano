<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dashboardPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGPS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="leatherSeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="steeringRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dashGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Windshield Curved Frame at Top -->
  <path d="M 50 110 Q 300 40 550 110 L 530 140 Q 300 70 70 140 Z" fill="#38bdf8" opacity="0.35"/>
  <path d="M 45 110 Q 300 40 555 110" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Compass in Center on Dashboard Top -->
  <circle cx="300" cy="115" r="18" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  <circle cx="300" cy="115" r="14" fill="#1e293b"/>
  <line x1="300" y1="103" x2="300" y2="127" stroke="#ef4444" stroke-width="2"/>
  <line x1="288" y1="115" x2="312" y2="115" stroke="#94a3b8" stroke-width="1.5"/>

  <g filter="url(#dashGlow)">
    <!-- Main Dashboard Body (Console Náutico) -->
    <path d="M 40 160 Q 300 130 560 160 L 580 340 L 20 340 Z" fill="url(#dashboardPanel)" stroke="#334155" stroke-width="3"/>
    <path d="M 60 168 Q 300 142 540 168" fill="none" stroke="#0284c7" stroke-width="2.5" opacity="0.8"/>

    <!-- Large Multi-Function Touch Display / GPS Chartplotter (Garmin/Simrad) -->
    <rect x="200" y="165" width="200" height="105" rx="8" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="208" y="173" width="184" height="89" rx="4" fill="url(#screenGPS)"/>
    <!-- Nautical Chart Map Graphic on Screen -->
    <path d="M 215 220 Q 250 190 300 230 Q 350 200 385 225" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 230 240 Q 280 215 340 250" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.6"/>
    <!-- Boat icon on GPS -->
    <polygon points="300,205 306,220 294,220" fill="#f59e0b"/>
    <text x="215" y="190" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">GPS 18.4 kts • PROF: 12.5m</text>

    <!-- Left Instrument Gauges (Conta-giros / Velocímetro / Horímetro) -->
    <g transform="translate(70, 175)">
      <!-- Tachometer -->
      <circle cx="35" cy="35" r="32" fill="#020617" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="35" cy="35" r="27" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
      <line x1="35" y1="35" x2="48" y2="20" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="55" fill="#94a3b8" font-size="7" font-family="sans-serif" font-weight="bold">RPM x1000</text>
    </g>

    <g transform="translate(130, 215)">
      <!-- Speedometer / Fuel Level -->
      <circle cx="25" cy="25" r="22" fill="#020617" stroke="#94a3b8" stroke-width="2"/>
      <line x1="25" y1="25" x2="35" y2="15" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <text x="17" y="38" fill="#38bdf8" font-size="6" font-family="sans-serif" font-weight="bold">FUEL</text>
    </g>

    <!-- Right Instrument Gauges (Pressão de Óleo / Temperatura / Trim) -->
    <g transform="translate(415, 175)">
      <circle cx="35" cy="35" r="32" fill="#020617" stroke="#94a3b8" stroke-width="2.5"/>
      <circle cx="35" cy="35" r="27" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
      <line x1="35" y1="35" x2="22" y2="20" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <text x="24" y="55" fill="#94a3b8" font-size="7" font-family="sans-serif" font-weight="bold">SPEED</text>
    </g>

    <g transform="translate(425, 235)">
      <circle cx="20" cy="20" r="18" fill="#020617" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="20" y1="20" x2="26" y2="10" stroke="#ef4444" stroke-width="1.5"/>
      <text x="12" y="30" fill="#22c55e" font-size="5" font-family="sans-serif" font-weight="bold">VOLTS</text>
    </g>

    <!-- Rocker Switches Panel (Interruptores de Bomba, Luzes, Buzina, Som) -->
    <g transform="translate(205, 280)">
      <rect x="0" y="0" width="190" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <!-- 6 Rocker Switches with Blue LEDs -->
      <rect x="12" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="20" cy="14" r="2" fill="#38bdf8"/>
      <rect x="42" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="50" cy="14" r="2" fill="#38bdf8"/>
      <rect x="72" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="80" cy="14" r="2" fill="#22c55e"/>
      <rect x="102" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="110" cy="14" r="2" fill="#38bdf8"/>
      <rect x="132" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="140" cy="14" r="2" fill="#ef4444"/>
      <rect x="162" y="8" width="16" height="24" rx="2" fill="#0f172a" stroke="#64748b"/>
      <circle cx="170" cy="14" r="2" fill="#38bdf8"/>
    </g>

    <!-- Engine Start/Stop & Key Ignition -->
    <circle cx="175" cy="300" r="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="175" cy="300" r="8" fill="#ef4444"/>
    <text x="171" y="303" fill="#ffffff" font-size="7" font-weight="bold">S</text>

    <!-- Twin Engine Throttle / Shift Lever (Manete de Aceleração Duplo em Inox) -->
    <g transform="translate(480, 240)">
      <rect x="0" y="20" width="45" height="60" rx="5" fill="#334155" stroke="#64748b" stroke-width="2"/>
      <path d="M 12 25 L 12 -15 Q 12 -30 25 -30 L 28 -30 Q 32 -30 32 -15 L 32 25 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
      <circle cx="28" cy="-30" r="10" fill="#0f172a" stroke="#e2e8f0" stroke-width="2"/>
      <!-- Trim button on throttle knob -->
      <rect x="22" y="-34" width="8" height="4" fill="#ef4444" rx="1"/>
    </g>

    <!-- Sport Nautical Steering Wheel (Volante Esportivo em Inox e Couro) -->
    <g transform="translate(130, 290)">
      <!-- Wheel Center & Hub -->
      <circle cx="60" cy="60" r="18" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="60" cy="60" r="10" fill="#0284c7"/>
      <!-- 3 Stainless Steel Spokes -->
      <line x1="60" y1="60" x2="60" y2="10" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="15" y2="90" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="105" y2="90" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
      <!-- Outer Steering Ring -->
      <circle cx="60" cy="60" r="54" fill="none" stroke="url(#steeringRim)" stroke-width="12"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- Helm Seat Cushion Preview (Banco do Piloto) -->
    <path d="M 50 370 Q 300 350 550 370 L 530 440 L 70 440 Z" fill="url(#leatherSeat)" stroke="#94a3b8" stroke-width="2"/>
    <line x1="200" y1="365" x2="200" y2="435" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="400" y1="365" x2="400" y2="435" stroke="#cbd5e1" stroke-width="2"/>
  </g>
</svg>
